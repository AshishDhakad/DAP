<div id="login">
  <h2>Enter your name</h2>
  <input id="uname" class="in" placeholder="username" autocomplete="off">
  <button class="btn" id="go">Enter chat</button>
  <div class="err" id="lerr"></div>
  <div id="hint" style="font-size:12px;color:var(--mut)"></div>
</div>

<div id="app">
  <div id="side">
    <h3>SHARED</h3>
    <div class="tabs"><button class="tab sel" data-t="files">Files</button><button class="tab" data-t="gal">Gallery</button></div>
    <div id="sideBody"></div>
  </div>
  <div id="main">
    <div id="top">
      <button id="mb">&#9776;</button>

  </div>
</div>

<script>
const $=i=>document.getElementById(i);
let me="",msgs=[],q="",tab="files",lastCount=-1;

// show allowed users on the login screen
fetch('/api/users').then(r=>r.json()).then(d=>{
  $("hint").textContent="Allowed: "+d.users.join(", ");
}).catch(()=>{ $("hint").textContent="Could not reach the server."; });

$("go").onclick=login;
$("uname").onkeydown=e=>{if(e.key==="Enter")login();};

async function login(){
  const name=$("uname").value.trim();
  if(!name){ $("lerr").textContent="Please enter a username."; return; }
  $("lerr").textContent="";
  let d;
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
    d=await r.json();
  }catch(err){ $("lerr").textContent="Could not reach the server. Try again."; return; }
  if(!d.ok){$("lerr").textContent=d.error||"User not found in database.";return;}
  me=d.name;
  $("login").style.display="none";$("app").classList.add("on");$("me").textContent="@"+me;
  poll(); setInterval(poll,2000);   // live refresh every 2s
}

async function poll(){
  try{
    const d=await (await fetch('/api/messages')).json();
    if(d.messages.length!==lastCount||q!==null){lastCount=d.messages.length;msgs=d.messages;render();}
  }catch(e){}
}

$("search").oninput=e=>{q=e.target.value.trim().toLowerCase();render();};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("sel"));
  t.classList.add("sel");tab=t.dataset.t;renderSide();
});
$("mb").onclick=()=>$("side").classList.toggle("open");

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(){
  const box=$("msgs");
  const near=box.scrollTop+box.clientHeight>box.scrollHeight-80;
  box.innerHTML=msgs.map(m=>{
    const hit=q&&(m.user||"").toLowerCase().includes(q);
    let body=esc(m.text||"");
    if(m.file){
      body+= (m.file.type||"").startsWith("image/")
        ? '<img src="'+esc(m.file.url)+'" alt="">'
        : '<div style="margin-top:6px">&#128196; <a href="'+esc(m.file.url)+'" target="_blank">'+esc(m.file.name)+'</a></div>';
    }
    return '<div class="m '+(m.user===me?"me":"")+' '+(hit?"hit":"")+'"><div class="who">'+esc(m.user)+'</div>'+body+'</div>';
  }).join("");
  if(near)box.scrollTop=box.scrollHeight;
  renderSide();
}

function renderSide(){
  const files=msgs.filter(m=>m.file);
  if(tab==="gal"){
    const imgs=files.filter(m=>(m.file.type||"").startsWith("image/"));
    $("sideBody").innerHTML=imgs.length
      ? '<div id="gal">'+imgs.map(m=>'<a href="'+esc(m.file.url)+'" target="_blank"><img src="'+esc(m.file.url)+'" title="'+esc(m.user)+'"></a>').join("")+'</div>'
      : '<div style="color:var(--mut);font-size:12px;padding:8px">No images yet</div>';
  }else{
    $("sideBody").innerHTML=files.length
      ? files.map(m=>{
          const t=m.file.type||"";
          const tag=t.startsWith("image/")?"PIC":(t.includes("pdf")?"PDF":"DOC");
          return '<a class="f" href="'+esc(m.file.url)+'" target="_blank"><span class="ic">'+tag+'</span><span>'+esc(m.file.name)+'<small>by '+esc(m.user)+'</small></span></a>';
        }).join("")
      : '<div style="color:var(--mut);font-size:12px;padding:8px">Nothing shared yet</div>';
  }
}

$("send").onclick=async()=>{
  const t=$("text").value.trim();if(!t)return;$("text").value="";
  try{
    const r=await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:me,text:t})});
    if(r.status===403){ $("status").textContent="Session invalid — please log in again."; return backToLogin(); }
    if(!r.ok){ const d=await r.json().catch(()=>({})); $("status").textContent="Send failed: "+(d.error||r.status); return; }
    poll();
  }catch(err){$("status").textContent="Send failed: network error";}
};
function backToLogin(){
  $("app").classList.remove("on");$("login").style.display="flex";
  me="";msgs=[];lastCount=-1;
}
$("text").onkeydown=e=>{if(e.key==="Enter")$("send").click();};
$("clip").onclick=()=>$("file").click();
$("file").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  $("status").textContent="Uploading "+f.name+"…";
  const fd=new FormData();fd.append('file',f);fd.append('user',me);
  try{
    const r=await fetch('/api/upload',{method:'POST',body:fd});
    if(r.status===403){ $("status").textContent="Session invalid — please log in again."; return backToLogin(); }
    if(!r.ok){
      const d=await r.json().catch(()=>({}));
      $("status").textContent="Upload failed: "+(d.error||r.status);
      return;
    }
    $("status").textContent="Uploaded ✓";
    setTimeout(()=>{ if($("status").textContent==="Uploaded ✓") $("status").textContent=""; },2000);
    poll();
  }catch(err){$("status").textContent="Upload failed: network error";}
};
</script></body></html>
